# Short-term reversal: buy last week's losers, sell last week's winners.
# High turnover by construction, which is exactly why the cost model matters here.

name = "reversal"
start = "2012-01-01"
end = "2024-12-31"
rebalance = "weekly"
execution_lag = 1
initial_capital = 1_000_000.0
engine = "vectorised"
epsilon = 0.002
max_turnover = 0.8
seed = 0

[universe]
region = "US"
asset_class = "stock"
interval = "1d"
top_n_by_liquidity = 500

[signal]
name = "reversal_5d"
neutralization = "zscore"

[signal.tradability]
min_price = 5.0
min_dollar_volume = 10_000_000.0
require_history = 252

[constructor]
name = "inverse_vol_weighted"
quantiles = 5
gross = 1.0
net = 0.0

[constraints]
max_weight_per_name = 0.03
min_positions = 20

[costs]
commission_bps = 0.5
half_spread_bps = 2.0
impact_coefficient = 0.1
borrow_bps_annual = 50.0

[execution]
fill_price = "next_open"
participation_rate = 0.05
whole_shares = true
